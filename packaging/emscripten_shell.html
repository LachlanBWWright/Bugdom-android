<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bugdom</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #1a1a2e;
      color: #eee;
      font-family: sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
    }
    #game-container {
      position: relative;
      width: 100%;
      max-width: 1280px;
    }
    canvas {
      display: block;
      width: 100% !important;
      height: auto !important;
      border: none;
      padding: 0;
      background: #000;
    }
    #overlay {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: rgba(0,0,0,0.8);
      cursor: pointer;
      z-index: 10;
    }
    #overlay h1 { font-size: 3em; margin-bottom: 0.5em; color: #ffd700; }
    #overlay p { font-size: 1.2em; color: #ccc; }
    #overlay.hidden { display: none; }
    #status-bar {
      width: 100%;
      max-width: 1280px;
      padding: 4px 8px;
      font-size: 0.85em;
      color: #aaa;
      background: #111;
      text-align: center;
    }
    #progress-container {
      width: 80%;
      max-width: 400px;
      margin-top: 1em;
      display: none;
    }
    #progress-container.visible { display: block; }
    #progress-bar-outer {
      width: 100%;
      height: 20px;
      background: #333;
      border-radius: 10px;
      overflow: hidden;
    }
    #progress-bar-inner {
      height: 100%;
      width: 0;
      background: #ffd700;
      transition: width 0.1s;
    }
    #progress-text { text-align: center; margin-top: 4px; font-size: 0.9em; color: #aaa; }
    #dev-panel {
      width: 100%;
      max-width: 1280px;
      padding: 8px;
      background: #111;
      display: none;
    }
    #dev-panel.visible { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
    #dev-panel label { font-size: 0.85em; color: #aaa; }
    #dev-panel button, #dev-panel select, #dev-panel input {
      font-size: 0.85em;
      padding: 4px 8px;
      border: 1px solid #444;
      background: #222;
      color: #eee;
      border-radius: 4px;
      cursor: pointer;
    }
    #dev-panel button:hover { background: #333; }
  </style>
</head>
<body>
  <div id="game-container">
    <div id="overlay">
      <h1>🐛 Bugdom</h1>
      <p>Click to start</p>
      <div id="progress-container">
        <div id="progress-bar-outer">
          <div id="progress-bar-inner"></div>
        </div>
        <div id="progress-text">Loading...</div>
      </div>
    </div>
    <canvas id="canvas" oncontextmenu="event.preventDefault()"></canvas>
  </div>

  <div id="status-bar">Bugdom WebAssembly — Use mouse + keyboard to play</div>

  <div id="dev-panel">
    <label>Developer Tools:</label>
    <label>Level:
      <select id="level-select">
        <option value="0">0 – Training</option>
        <option value="1">1 – Lawn</option>
        <option value="2">2 – Pond</option>
        <option value="3">3 – Beach</option>
        <option value="4">4 – Flight (Boss)</option>
        <option value="5">5 – Bee Hive</option>
        <option value="6">6 – Queen Bee (Boss)</option>
        <option value="7">7 – Night</option>
        <option value="8">8 – Ant Hill</option>
        <option value="9">9 – Ant King (Boss)</option>
      </select>
    </label>
    <button id="btn-fence-toggle">Toggle Fence Collision</button>
    <label><input type="checkbox" id="chk-no-fence"> No Fence Collision</label>
    <label>Terrain Override (colon-path):
      <input type="text" id="terrain-override" placeholder=":Terrain:Custom.ter" size="25">
    </label>
    <button id="btn-apply-terrain">Apply Terrain Override</button>
    <span id="fence-status" style="margin-left:8px;font-size:0.85em;color:#aaa;"></span>
  </div>

  <script>
    var Module = {
      canvas: (function() { return document.getElementById('canvas'); })(),

      preRun: [],
      postRun: [],

      // Called with download progress
      setStatus: function(text) {
        if (!text) return;
        document.getElementById('status-bar').textContent = text;
      },

      monitorRunDependencies: function(left) {
        if (left > 0) {
          document.getElementById('progress-container').classList.add('visible');
        } else {
          document.getElementById('progress-container').classList.remove('visible');
        }
      },

      // Track download progress for the .data file
      totalDependencies: 0,
      print: function(text) { console.log('[Bugdom]', text); },
      printErr: function(text) { console.error('[Bugdom]', text); },
    };

    // Intercept XHR to show loading progress
    (function() {
      var origOpen = XMLHttpRequest.prototype.open;
      XMLHttpRequest.prototype.open = function(method, url) {
        if (url && url.endsWith && url.endsWith('.data')) {
          this.addEventListener('progress', function(e) {
            if (e.lengthComputable) {
              var pct = Math.round(100 * e.loaded / e.total);
              document.getElementById('progress-bar-inner').style.width = pct + '%';
              document.getElementById('progress-text').textContent =
                'Loading game data: ' + pct + '% (' +
                Math.round(e.loaded / 1048576) + ' / ' +
                Math.round(e.total / 1048576) + ' MB)';
            }
          });
        }
        return origOpen.apply(this, arguments);
      };
    })();

    // Handle click-to-start overlay
    var gameStarted = false;
    document.getElementById('overlay').addEventListener('click', function() {
      if (!gameStarted) {
        gameStarted = true;
        this.classList.add('hidden');
        // Show dev panel if ?dev query param is present
        if (new URLSearchParams(window.location.search).has('dev')) {
          document.getElementById('dev-panel').classList.add('visible');
        }
        // Call main() which was deferred
        if (typeof _main === 'function') {
          // Already running via emscripten_set_main_loop; audio context was blocked
          // Clicking the overlay unblocks it
        }
        // Resume audio if suspended
        if (typeof Module.SDL2 !== 'undefined' && Module.SDL2.audioContext &&
            Module.SDL2.audioContext.state === 'suspended') {
          Module.SDL2.audioContext.resume();
        }
      }
    });

    // Developer panel controls (available after game loads)
    document.getElementById('btn-fence-toggle').addEventListener('click', function() {
      if (typeof Module.ccall === 'function') {
        var current = Module.ccall('BugdomGetFenceCollision', 'number', [], []);
        Module.ccall('BugdomSetFenceCollision', null, ['number'], [current ? 0 : 1]);
        updateFenceStatus();
      }
    });

    document.getElementById('chk-no-fence').addEventListener('change', function() {
      if (typeof Module.ccall === 'function') {
        Module.ccall('BugdomSetFenceCollision', null, ['number'], [this.checked ? 0 : 1]);
        updateFenceStatus();
      }
    });

    function updateFenceStatus() {
      if (typeof Module.ccall === 'function') {
        var enabled = Module.ccall('BugdomGetFenceCollision', 'number', [], []);
        document.getElementById('fence-status').textContent =
          'Fence collision: ' + (enabled ? 'ON' : 'OFF');
        document.getElementById('chk-no-fence').checked = !enabled;
      }
    }

    document.getElementById('btn-apply-terrain').addEventListener('click', function() {
      if (typeof Module.ccall === 'function') {
        var path = document.getElementById('terrain-override').value.trim();
        Module.ccall('BugdomSetTerrainOverride', null, ['string'], [path]);
        document.getElementById('status-bar').textContent =
          'Terrain override set to: ' + (path || '(cleared)');
      }
    });

    // Periodically update fence status when game is running
    setInterval(function() {
      if (typeof Module.ccall === 'function' && gameStarted) {
        updateFenceStatus();
      }
    }, 500);
  </script>

  {{{ SCRIPT }}}
</body>
</html>
