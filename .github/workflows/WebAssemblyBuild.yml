name: WebAssembly Build and Deploy

on:
  push:
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  build-wasm:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with: {submodules: 'recursive'}

      # Configure the GitHub Pages environment (sets base URL etc.)
      - name: Setup Pages
        if: github.ref == 'refs/heads/master'
        uses: actions/configure-pages@v5

      # Install Emscripten SDK via git clone to avoid emsdk-update network failures.
      # mymindstorm/setup-emsdk always calls 'emsdk update' on cache miss (due to a
      # JS bug where update:"false" is a truthy string), and that download fails with
      # "Remote end closed connection without response".
      - name: Cache Emscripten SDK
        id: cache-emsdk
        uses: actions/cache@v4
        with:
          path: .emsdk
          key: emsdk-${{ runner.os }}-${{ runner.arch }}-v1
          restore-keys: emsdk-${{ runner.os }}-${{ runner.arch }}-

      - name: Install Emscripten
        run: |
          if [ ! -f .emsdk/emsdk ]; then
            git clone --depth=1 https://github.com/emscripten-core/emsdk.git .emsdk
            .emsdk/emsdk install latest
          fi
          .emsdk/emsdk activate latest
          source .emsdk/emsdk_env.sh
          echo "EMSDK=$EMSDK" >> "$GITHUB_ENV"
          echo "EM_CONFIG=$EM_CONFIG" >> "$GITHUB_ENV"
          echo "EM_CACHE=$EM_CACHE" >> "$GITHUB_ENV"
          echo "$EMSDK" >> "$GITHUB_PATH"
          echo "$EMSDK/upstream/emscripten" >> "$GITHUB_PATH"
          echo "$EMSDK/upstream/bin" >> "$GITHUB_PATH"
          for d in "$EMSDK/node/"*/bin; do [ -d "$d" ] && echo "$d" >> "$GITHUB_PATH"; done

      - name: Cache SDL3 build
        id: cache-sdl3-wasm
        uses: actions/cache@v4
        with:
          path: |
            extern/SDL3-3.2.8/install-wasm
            /tmp/pangea-games-build-cache/SDL3-3.2.8.tar.gz
          key: sdl3-wasm-3.2.8-${{ runner.os }}

      - name: Build SDL3 and configure for Emscripten
        run: python3 build_wasm.py --dependencies --configure

      - name: Build WebAssembly
        run: python3 build_wasm.py --build

      - name: Package
        run: python3 build_wasm.py --package

      - name: Browser test (Playwright)
        run: |
          pip3 install playwright
          python3 -m playwright install chromium
          # Serve the dist-wasm directory over HTTP
          python3 -m http.server 8888 --directory dist-wasm &
          sleep 3
          python3 test_wasm_browser.py --url http://localhost:8888/Bugdom.html

      - name: Upload WASM artifact
        uses: actions/upload-artifact@v4
        with:
          name: Bugdom-wasm
          path: dist-wasm/
          compression-level: 0

      - name: Prepare GitHub Pages content
        run: |
          mkdir -p gh-pages

          # Copy all static assets from docs/ (screenshots, PDFs, etc.)
          # The shell.html is a build template used by Emscripten; it's not copied directly.
          for f in docs/*; do
            case "$f" in
              docs/shell.html) ;;  # Skip — the built Bugdom.html (with our shell) is used instead
              *) cp -r "$f" gh-pages/ 2>/dev/null || true ;;
            esac
          done

          # Copy WASM game files — rename Bugdom.html to game.html
          cp dist-wasm/Bugdom.html gh-pages/game.html
          cp dist-wasm/Bugdom.js   gh-pages/Bugdom.js
          cp dist-wasm/Bugdom.wasm gh-pages/Bugdom.wasm
          [ -f dist-wasm/Bugdom.data ] && cp dist-wasm/Bugdom.data gh-pages/Bugdom.data || true

          # Prevent Jekyll from processing our static site files
          touch gh-pages/.nojekyll

          echo "Site contents:"
          ls -lh gh-pages/

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: gh-pages/

  deploy-pages:
    needs: build-wasm
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/master'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  release-wasm:
    needs: build-wasm
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    steps:
      - uses: actions/checkout@v4

      - name: Download WASM artifact
        uses: actions/download-artifact@v4.1.3
        with:
          name: Bugdom-wasm
          path: dist-wasm/

      - name: Get version
        id: version
        run: |
          VERSION=$(python3 -c "
          import re
          with open('src/Headers/version.h') as f:
              for line in f:
                  m = re.match(r'#define GAME_VERSION\s+\"(.+)\"', line)
                  if m:
                      print(m.group(1))
                      break
          ")
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Create or update WebAssembly release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: wasm-latest
          name: "Bugdom WebAssembly (latest)"
          body: |
            ## Bugdom WebAssembly Build

            This release contains the latest WebAssembly build of Bugdom, automatically built from the `master` branch.

            **Play online:** See the [GitHub Pages site](https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/)

            ### Files
            - `Bugdom-${{ steps.version.outputs.version }}-wasm.zip` — WebAssembly bundle (HTML + JS + WASM + data)

            ### Level Editor Integration
            Use URL query parameters to jump directly to a level:
            - `?level=N` — start at level N (0=Training, 1=Lawn, … 9=Ant King)
            - `?terrainFile=:Terrain:Custom.ter` — override terrain file
            - `?noFenceCollision=1` — disable fence collisions
            - `?dev` — show developer tools panel

            ### JavaScript API (Cheat Interface)
            ```javascript
            // Fence collision toggle
            Module.ccall('BugdomSetFenceCollision', null, ['number'], [0]); // disable
            Module.ccall('BugdomSetFenceCollision', null, ['number'], [1]); // enable
            Module.ccall('BugdomGetFenceCollision', 'number', [], []);      // query

            // Get current level
            Module.ccall('BugdomGetCurrentLevel', 'number', [], []);

            // Override terrain for next level load
            Module.ccall('BugdomSetTerrainOverride', null, ['string'], [':Terrain:Custom.ter']);
            ```
          files: dist-wasm/Bugdom-*-wasm.zip
          prerelease: false
          make_latest: false
